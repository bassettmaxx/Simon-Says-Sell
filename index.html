<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport"   id="viewportMeta" content=" initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simon Says Sell</title>

    <script>
        // width the page is laid out at in "desktop mode" on a phone / tablet
        const DESKTOP_WIDTH = 1280;
        // remember the choice for this tab so a refresh doesn't show the card again
        try {
            if (sessionStorage.getItem('desktopMode') === '1') {
                document.documentElement.classList.add('desktop-mode');
                // document.getElementById('viewportMeta').setAttribute('content', 'width=device-width');
            }
        } catch (e) {}
    </script>

    <!-- load the fonts early so the text doesn't flash in a fallback font -->
    <link rel="preload" href="Fonts/nk57_monospace/NK57%20Monospace%20Ex%20Lt.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="Fonts/nk57_monospace/NK57%20Monospace%20Sc%20Lt.otf" as="font" type="font/otf" crossorigin>

    <style>

        @font-face {
            font-family: 'nk57 reg';
            src: url('Fonts\\nk57_monospace\\NK57 Monospace Sc Lt.otf') format('opentype');
        }

        @font-face {
            font-family: 'nk57 butter';
            src: url('Fonts/nk57_monospace/NK57%20Monospace%20Ex%20Lt.otf') format('opentype');
            font-display: swap;
        }

        @font-face {
            font-family: 'nk57';
            src: url('Fonts/nk57_monospace/NK57%20Monospace%20Sc%20Lt.otf') format('opentype');
            font-display: swap;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #0e0700;
        }

        iframe {
            display: block;       /* removes the small gap inline iframes leave */
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Splash sits on top of the iframe, which loads underneath it */
        .splash {
            /* TIMING KNOBS
               --hold: when the background starts fading (the text is fully gone by then)
               --fade: how long the background fade takes
               --text-out: how long the text takes to fade out */
            --hold: 0.75s;
            --fade: 0.6s;
            --text-out: 0.75s;
            --hold_text: 1.5s;

            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000f7;
            backdrop-filter: blur(10px);
            color: hsl(0, 100%, 99%);
            font-family: 'nk57 butter', monospace;
            font-size: 65px;
            text-align: center;
           

            /* background waits for --hold, then fades. visibility: hidden at the end
               also stops it from blocking clicks on the page. */
            animation: splash-out var(--fade) ease var(--hold) forwards;
        }

        /* Text: fades in, then fades out so it is gone right when the background starts to fade */
        .splash span {
            margin-top: 9vh;
            opacity: 0;
            animation:
                text-in 0.3s ease 0.3s forwards,
                text-out var(--text-out) ease calc(var(--hold_text) - var(--text-out)) forwards;
        }

        @keyframes splash-out {
            0% { opacity: 0.99; background: 0e070005; backdrop-filter: blur(10px); visibility: visible; }
            
            100%   { opacity: 0.1; backdrop-filter: blur(10px);  visibility: hidden; }
        }

        @keyframes text-in {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes text-out {
            from { opacity: 1; }
            to   { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .splash { animation-duration: 0.1s; }
            .splash span {
                animation:
                    text-in 0.01s ease 0s forwards,
                    text-out 0.01s ease calc(var(--hold_text) - 0.01s) forwards;
            }
        }

        /* ---------- DESKTOP NOTICE: shown below 1024px wide until desktop mode is chosen ---------- */
        .desktop_notice {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;           /* above the splash */
            align-items: center;
            justify-content: center;
            padding: 6vw;
            background: rgba(14, 7, 0, 0.94);
            backdrop-filter: blur(6px);
            color: hsl(0, 100%, 99%);
            font-family: 'nk57 butter', monospace;
        }
        @media (max-width: 1023px) {
            html:not(.desktop-mode) .desktop_notice { display: flex; }
        }
        .desktop_card {
            max-width: 420px;
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            text-align: center;
            border: 1px solid hsla(0, 0%, 100%, 0.4);
            border-radius: 9px;
            background: #00000067;
        }
        .desktop_card_text {
            margin: 0;
            font-size: 18px;
            line-height: 1.5;
        }
        .desktop_btn {
            font-family: 'nk57 butter', monospace;
            font-size: 16px;
            padding: 12px 20px;
            color: white;
            background: transparent;
            border: 1px solid white;
            border-radius: 9px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .desktop_btn:hover,
        .desktop_btn:focus-visible { background: white; color: hsl(0, 0%, 0%); outline: none; }

        /* ---------- ROTATE NOTICE: desktop mode + touch device + portrait ----------
           Desktop mode lays the page out at 1280px wide and shrinks it to fit the phone,
           so this card is sized in vw (not px) to stay readable after the shrink. */
        .rotate_notice {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            align-items: center;
            justify-content: center;
            background: rgba(14, 7, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: hsl(0, 100%, 99%);
            font-family: 'nk57 butter', monospace;
        }
        @media (orientation: portrait) and (pointer: coarse) {
            html.desktop-mode:not(.rotate-dismissed) .rotate_notice { display: flex; }
        }
        .rotate_card {
            width: 80vw;
            padding: 7vw 6vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5vw;
            text-align: center;
            border: 1px solid hsla(0, 0%, 100%, 0.4);
            border-radius: 2vw;
            background: #00000067;
        }
        .rotate_icon {
            width: 9vw;
            height: 16vw;
            border: 0.6vw solid white;
            border-radius: 1.8vw;
            animation: rotate-hint 2.4s ease-in-out infinite;
        }
        @keyframes rotate-hint {
            0%, 25%   { transform: rotate(0deg); }
            60%, 100% { transform: rotate(-90deg); }
        }
        .rotate_text {
            margin: 0;
            font-size: 4.5vw;
            line-height: 1.5;
        }
        .rotate_dismiss {
            font-family: 'nk57 butter', monospace;
            font-size: 3.5vw;
            color: hsla(0, 0%, 100%, 0.6);
            background: none;
            border: none;
            padding: 1vw;
            cursor: pointer;
        }
        @media (prefers-reduced-motion: reduce) {
            .rotate_icon { animation: none; transform: rotate(-90deg); }
        }
    </style>
</head>
<body>
    <div class="splash" aria-hidden="true">
        <span>simon says sell</span>
    </div>

    <iframe id="landingFrame" src="landing.html" title="Simon Says Sell"  ></iframe>

    <div class="desktop_notice" role="dialog" aria-modal="true" aria-labelledby="desktopText">
        <div class="desktop_card">
            <p class="desktop_card_text" id="desktopText">this website is best experienced on a desktop</p>
            <button class="desktop_btn" id="desktopBtn" type="button">switch to desktop mode</button>
        </div>
    </div>

    <div class="rotate_notice" role="dialog" aria-modal="true" aria-labelledby="rotateText">
        <div class="rotate_card">
            <div class="rotate_icon" aria-hidden="true"></div>
            <p class="rotate_text" id="rotateText">rotate your phone for the best experience</p>
            <button class="rotate_dismiss" id="rotateDismiss" type="button">continue anyway</button>
        </div>
    </div>

    <script>
        document.getElementById('desktopBtn').addEventListener('click', () => {
            document.documentElement.requestFullscreen();
            document.documentElement.classList.add('desktop-mode');
            // document.getElementById('viewportMeta').setAttribute('content', 'width=' + DESKTOP_WIDTH);
            try { sessionStorage.setItem('desktopMode', '1'); } catch (e) {}

            // best effort: also tell the page inside the iframe, so its own card (if it has one)
            // doesn't show on a narrow desktop window. Only works when both files share an origin.
            try {
                document.getElementById('landingFrame').contentDocument
                    .documentElement.classList.add('desktop-mode');
            } catch (e) {}
        });

        // lets the visitor past the rotate card (e.g. if their phone's rotation is locked)
        document.getElementById('rotateDismiss').addEventListener('click', () => {
            document.documentElement.classList.add('rotate-dismissed');
            
        });
    </script>
</body>
</html>

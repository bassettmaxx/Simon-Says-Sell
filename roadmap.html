<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Sell</title>

<style>
    @font-face {
        font-family: 'nk57 reg';
        src: url('Fonts/nk57_monospace/NK57 Monospace Sc Lt.otf') format('opentype');
    }

    @font-face {
        font-family: 'nk57 butter';
        src: url('Fonts/nk57_monospace/NK57 Monospace Ex Lt.otf') format('opentype');
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background: #0e07003a;
        color: hsl(0, 100%, 99%);
        font-family: 'nk57 reg', monospace;
    }

    input[type="checkbox"] {
    accent-color: #000000f4; /* Changes the checked background color */
    width: 1.25rem;
    height: 1.25rem;
    pointer-events: none;   /* can't be clicked */
    }

    /* ---------- STAGE: top row (image + title), middle row (roadmap), bottom row (info) ---------- */
    .stage {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr auto 1fr;
        gap: 2vw;
        padding: 4vh 5vw 0;
    }

    s{
        text-decoration: line-through #ffffffc6 2px;
    }
    .slot {
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .slot.show { opacity: 1; transform: none; }

    /* image: top left */
    .slot_image {
        grid-column: 1;
        grid-row: 1;
        border: 0px solid rgb(0, 0, 0); 
        background: #00000067 center / cover no-repeat;
        min-height: 0;
        top: 5vh;
        position: relative;
        border-radius: 3px;

    }

  

    /* title: top right */
    .slot_title {
        grid-column: 2;
        grid-row: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'nk57 butter', monospace;
        font-size: clamp(28px, 5vw, 72px);
        line-height: 1.1;
        text-align: center;
    }

    /* info box: lower half, full width */
    .slot_info {
        grid-column: 1 / -1;
        grid-row: 3;
        border: 0px solid white;
        padding: 3vh 3vw;
        font-size: clamp(14px, 1.4vw, 20px);
        line-height: 1.6;
        text-align: left;
        overflow-y: auto;
        min-height: 0;
        background: #00000067;
    }

    /* goal line + task rows inside the info box */
    .goal {
        margin: 0 0 2vh;
        opacity: 0.6;
    }
    .task {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.5vh 0;
        pointer-events: none;   /* clicking the label can't toggle the box either */
    }

    /* ---------- ROADMAP (your original line + buttons) ---------- */
    .roadmap_wrap {
        grid-column: 1 / -1;
        grid-row: 2;
        position: relative;
        height: 14vh;
    }

    .roadmap_line {
        position: absolute;
        top: 75%;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        height: 1px;
        background-color: white;
        justify-content: space-between;
        align-content: center;
        display: flex;
    }

    .roadmap_button {
        background-color: hsla(0, 0%, 0%, 0);
        border: none;
        width: 5vw;
        height: 5vh;
        cursor: pointer;
        color: white;
        font-size: 20px;
        padding: 20px;
        font-family: 'nk57 butter', monospace;
        display: grid;
    }

    .roadmap_button:hover *,
    .roadmap_button:focus-visible *,
    .roadmap_button.active * {
        color: hsl(0, 0%, 0%);
        text-shadow:
            -1px -1px 0 #fff,
             1px -1px 0 #fff,
            -1px  1px 0 #fff,
             1px  1px 0 #fff;
    }

    .roadmap_button:focus-visible { outline: 1px dashed white; outline-offset: 4px; }

    .roadmap_number {
        position: relative;
        top: -3.5vh;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        opacity: 1;
        font-size: 21px;
        font-family: 'nk57 reg', monospace;
    }

    .roadmap_milestone {
        position: relative;
        top: -6vh;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 21px;
    }

    .roadmap_line   { transition: background-color 0.25s ease; }
    .roadmap_button { transition: opacity 0.25s ease; }

    /* content visible: fade the line and every button except the active one */
    .stage:has(.slot.show) .roadmap_line { background-color: hsla(0, 0%, 100%, 0.33); }
    .stage:has(.slot.show) .roadmap_button:not(.active) { opacity: 0.33; }

    /* ---------- NEXT MILESTONE MARKER: line down from the roadmap, text underneath ---------- */
    .next_marker {
        position: absolute;
        top: 115%;
        left: 50%;                       /* JS moves this under the chosen milestone */
        transform: translateX(-48%);
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
        transition: opacity 0.25s ease;
    }
    .next_marker_line {
        width: 1px;
        height: 12vh;
        background: hsla(0, 0%, 100%, 0.6);
    }
    .next_marker_text {
        margin: 1vh 0 0;
        font-size: clamp(14px, 1.4vw, 20px);
        opacity: 0.6;
        white-space: nowrap;
    }
    .stage:has(.slot.show) .next_marker { opacity: 0; }

    /* intro: centred in the upper half, hidden while content is showing */
    .intro {
        grid-column: 1 / -1;
        grid-row: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5vh;
        text-align: center;
        pointer-events: none;
        transition: opacity 0.25s ease;
        margin-top: 22vh;
    }
    .intro_title {
        margin: 0;
        font-family: 'nk57 butter', monospace;
        font-size: clamp(28px, 5vw, 72px);
        line-height: 1.1;
    }
    .intro_hint {
        margin: 0;
        font-size: clamp(16px, 1.4vw, 20px);
        opacity: 0.6;
    }
    .stage:has(.slot.show) .intro { opacity: 0; }

    @media (max-width: 700px) {
        .stage { grid-template-columns: 1fr; grid-template-rows: 22vh auto auto 1fr; padding-bottom: 3vh; }
        .slot_image { grid-column: 1; grid-row: 1; }
        .slot_title { grid-column: 1; grid-row: 2; }
        .roadmap_wrap { grid-row: 3; }
        .slot_info  { grid-column: 1; grid-row: 4; }
        .roadmap_button { width: 12vw; }
    }

    @media (prefers-reduced-motion: reduce) {
        .slot { transition: none; transform: none; }
    }
</style>
</head>

<body>
    <main class="stage">
        <div class="intro">
            <h2 class="intro_title">milestones</h2>
            <p class="intro_hint">move your cursor to a milestone to read it, or scroll</p>
        </div>
        <div class="slot slot_image" id="slotImage"></div>
        <h1 class="slot slot_title" id="slotTitle"></h1>
        <div class="slot slot_info" id="slotInfo"></div>

        <div class="roadmap_wrap" id="roadmapWrap">
            <div class="roadmap_line">
                <button class="roadmap_button" data-key="p"><div class="roadmap_milestone">P</div><div class="roadmap_number">1</div></button>
                <button class="roadmap_button" data-key="rf"><div class="roadmap_milestone" style="left:13px; position: relative;">RF</div><div class="roadmap_number" style="left:13px; position: relative;">2</div></button>
                <button class="roadmap_button" data-key="g"><div class="roadmap_milestone">G</div><div class="roadmap_number">3</div></button>
                <button class="roadmap_button" data-key="h"><div class="roadmap_milestone">H</div><div class="roadmap_number">4</div></button>
                <button class="roadmap_button" data-key="r"><div class="roadmap_milestone">R</div><div class="roadmap_number">5</div></button>
            </div>

            <div class="next_marker" id="nextMarker">
                <div class="next_marker_line"></div>
                <p class="next_marker_text">current goal</p>
            </div>
        </div>
    </main>

<script>
    /* ---------- CONTENT: one entry per button, keyed by data-key ----------
       goal: one-line summary shown at the top (dimmed)
       todo: tasks still to do        -> unchecked, shown first
       done: tasks that are finished  -> checked + struck through, shown below
       To finish a task, move its line from todo to done.
       image: put a path like "Images/p.jpg" — empty shows the translucent placeholder box. */
    const content = {
        p: {
            title: "Proof",
            image: "https://i.pinimg.com/736x/70/f9/27/70f92723a2c15ec35c942f86e94afd08.jpg",
            goal: "Prove SimonsTown store owners want the revival festival, and need advertisement",
            done: [
                "Pitch stores on Revival Festival",
                "Get first store to join the Revival Festival",
            ],
            todo: [],
        },
        rf: {
            title: "Revival Festival",
            image: "https://i.pinimg.com/736x/d9/2b/7e/d92b7e729f79f3e14079ed3f94d09f7e.jpg",
            goal: "Run the first Revival Festival",
            done: [],
            todo: [
                "Build proof of skill [ kondenser_studios ]",
                "Workshop revival festival with GreenDoor owner",
                "Make the ads!",
                "Run the ads!",
                "collect first income",
                "Round 2!"
            ],
        },
        g: { title: "Grow",   image: "https://i.pinimg.com/1200x/54/5b/e2/545be2c66a05fc101e174f93aeabdd8a.jpg", goal: "Outgrow the Revival Festival",
         done: [], 
         todo: [
            "Complete first commisioned advert",
            "Get first Advert Supply client!",
            "Earn more from Advert Supply/Commisions than Revival Festival",
            
         ] },
        h: { title: "Hire",   image: "https://i.pinimg.com/736x/2b/72/d4/2b72d4fe4497c1fbbfe9c23b0640569e.jpg", goal: "Build a team to takeover & scale", 
        done: [

        ], 
        todo: [
            "Hire first employee!!!",
            "Train first employee",
            "Hire team",
            "Train team",

        ] },
        r: { title: "Retire", image: "https://i.pinimg.com/736x/47/28/0a/47280aaf1c1a66e3f15ececf32990249.jpg", goal: "Pass the reigns down", 
        done: [

        ], 
        todo: [
            "Train employee into director",
            "Step away"
        ] },
    };

    /* turns a milestone's goal / todo / done into the HTML for the info box */
    function renderInfo({ goal = "", done = [], todo = [] }) {
        const row = (text, isDone) =>
            `<label class="task">
                <input type="checkbox" tabindex="-1" ${isDone ? "checked" : ""}>
                <span>${isDone ? `<s>${text}</s>` : text}</span>
            </label>`;

        return (goal ? `<p class="goal">${goal}</p>` : "")
            + todo.map(t => row(t, false)).join("")
            + done.map(t => row(t, true)).join("");
    }

    // which milestone the marker points to — use a key from `content` (p, rf, g, h, r)
    const NEXT_MILESTONE = 'rf';

    const slotImage = document.getElementById('slotImage');
    const slotTitle = document.getElementById('slotTitle');
    const slotInfo  = document.getElementById('slotInfo');
    const buttons   = document.querySelectorAll('.roadmap_button');
    const wrap      = document.getElementById('roadmapWrap');
    const marker    = document.getElementById('nextMarker');

    /* ---------- NEXT MILESTONE MARKER ---------- */
    function placeNextMarker() {
        const btn = document.querySelector(`.roadmap_button[data-key="${NEXT_MILESTONE}"]`);
        if (!btn) { marker.style.display = 'none'; return; }
        marker.style.display = '';
        const w = wrap.getBoundingClientRect();
        const b = btn.getBoundingClientRect();
        marker.style.left = (b.left + b.width / 2 - w.left) + 'px';
    }
    placeNextMarker();
    window.addEventListener('resize', placeNextMarker);
    window.addEventListener('load', placeNextMarker);

    /* ---------- SCRAMBLE TEXT ---------- */
    const SCRAMBLE_CHARS = '01';
    const scrambleFrames = new WeakMap();

    function scramble(el, html, duration = 7) {
        cancelAnimationFrame(scrambleFrames.get(el));
        el.innerHTML = html;
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        // collect text nodes so any tags inside the info HTML are left intact
        const nodes = [];
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) nodes.push(walker.currentNode);

        const finals = nodes.map(n => n.nodeValue);
        const total = finals.reduce((sum, t) => sum + t.length, 0);
        if (!total) return;

        // each character settles at its own time: roughly left to right, with jitter
        let index = 0;
        const reveals = finals.map(t =>
            [...t].map(() => (index++ / total) * duration * 0.07 + Math.random() * duration * 0.3)
        );

        const start = performance.now();
        let last = 0;

        function frame(now) {
            const t = now - start;
            if (t >= duration) {
                nodes.forEach((n, i) => (n.nodeValue = finals[i]));
                return;
            }
            if (now - last > 35) {            // ~28 fps keeps the flicker readable
                last = now;
                nodes.forEach((n, i) => {
                    n.nodeValue = [...finals[i]].map((c, j) =>
                        /\s/.test(c) || t >= reveals[i][j]
                            ? c
                            : SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)]
                    ).join('');
                });
            }
            scrambleFrames.set(el, requestAnimationFrame(frame));
        }
        scrambleFrames.set(el, requestAnimationFrame(frame));
    }

    /* ---------- SHOW / HIDE ---------- */
    let activeKey = null;

    function show(key) {
        const item = content[key];
        if (!item) return;
        if (activeKey === key) return;   // already showing: don't re-scramble on re-hover
        activeKey = key;

        buttons.forEach(b => b.classList.toggle('active', b.dataset.key === key));

        slotImage.style.backgroundImage = item.image ? `url("${item.image}")` : 'none';
        scramble(slotTitle, item.title, 600);
        scramble(slotInfo, renderInfo(item), 900);

        [slotImage, slotTitle, slotInfo].forEach(s => s.classList.add('show'));
    }

    function hide() {
        activeKey = null;
        buttons.forEach(b => b.classList.remove('active'));
        [slotImage, slotTitle, slotInfo].forEach(s => s.classList.remove('show'));
    }

    buttons.forEach(btn => {
        const key = btn.dataset.key;
        // hover shows (mouse only, so a tap isn't shown then instantly hidden by its click)
        btn.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') show(key); });
        // keyboard focus shows
        btn.addEventListener('focus', () => { if (btn.matches(':focus-visible')) show(key); });
        // click toggles: hides if this button's content is already visible
        btn.addEventListener('click', () => (activeKey === key ? hide() : show(key)));
    });

    /* ---------- MOUSE WHEEL: cycle through milestones ---------- */
    const keys = [...buttons].map(b => b.dataset.key);
    const WRAP_SCROLL = true;        // false = stop at the first / last milestone
    const WHEEL_COOLDOWN = 400;      // ms between steps; raise it if a trackpad skips milestones
    let wheelLock = false;

    window.addEventListener('wheel', e => {
        // let a long info box scroll normally while it's showing
        if (slotInfo.classList.contains('show') && slotInfo.contains(e.target)
            && slotInfo.scrollHeight > slotInfo.clientHeight) return;
        if (wheelLock || Math.abs(e.deltaY) < 4) return;
        wheelLock = true;
        setTimeout(() => (wheelLock = false), WHEEL_COOLDOWN);

        const dir = e.deltaY > 0 ? 1 : -1;
        // nothing showing yet: scroll down starts at the first, scroll up at the last
        let i = activeKey ? keys.indexOf(activeKey) : (dir > 0 ? -1 : keys.length);
        i += dir;
        if (WRAP_SCROLL) i = (i + keys.length) % keys.length;
        else i = Math.max(0, Math.min(keys.length - 1, i));
        show(keys[i]);
    }, { passive: true });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html{ background: #0e0700; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; max-height: 100vh;  color: hsl(0, 100%, 99%); max-width:100vw; overflow-x: hidden; text-align: center; align-items: center; justify-content: center; }
        body{ font-size: 42px; Grid-template-rows: 50vh 50vh minmax(0px,0fr); display: grid; }
        .textbox{top:5vh; grid-row: 2; width: 66vw; position: relative; text-align: center; font-size: 25px; max-height: 15vw; margin-bottom: 15vw; }
        .card{ top:15vh; grid-row: 1; margin: 0 auto; max-width: 20vw; max-height: 33vh; position: relative; transition: transform 0.42s ease; transform-style: preserve-3d; border-radius: 10px; box-shadow: 1px 2px 10px rgba(0, 0, 0, 0.5); }
        .card:hover{ transform: scale(1.05) rotateX(5deg) rotateY(5deg); transition: transform 0.42s ease-in-out; box-shadow: 5px 8px 30px rgba(0, 0, 0, 0.3); }
    </style>
</head>
<body>
    <img src="simon.jpg" alt="Simon Says Sell Logo" class="card">

    <div class="textbox">
        Simon Says Sell is my answer to the question: <br></br>
        "How can I provide value to my community, with the skills and resources I currently have"
    </div>
</body>
</html>

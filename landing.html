<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Sell</title>
    <style>
        body{max-height: 100vh; margin-top: 5vw; background: #000000; color: #f8f8f8; width:max-content; overflow-x: hidden; font-size: 21px; Grid-template-rows: 33vw 33vw 33vw minmax(0px,0fr); display: grid; text-align: center; align-items: center;}
        .textbox{grid-row: 2; width: 50vw; position: relative; left: 25vw; text-align: center; font-size: 21px; max-height: 15vw;}
        .card{grid-row: 1; width: 50vw; position: relative; left: 25vw;}
    </style>
</head>
<body>
    <img src="simon-says-sell-logo.png" alt="Simon Says Sell Logo" class="card">

    <div class="textbox">
        Simon Says Sell is the answer to the question: <br></br>
        "How can I provide value to my community, with the skills and resources I currently have"
    </div>
</body>
</html>

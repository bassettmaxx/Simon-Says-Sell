<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" initial-scale=1.0 maximum-scale="1.0">

    <style>
        @font-face {
            font-family: 'nk57 reg';
            src: url('Fonts\\nk57_monospace\\NK57 Monospace Sc Lt.otf') format('opentype');
        }

        @font-face {
            font-family: 'nk57 butter';
            src: url('Fonts\\nk57_monospace\\NK57 Monospace Ex Lt.otf') format('opentype');
        }

        html{ 
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none;     /* IE 10 and IE 11 */
            user-select: none;         /* Standard syntax */
            cursor: pointer;           /* Ensures the hand cursor shows instead of a text I-beam */
            font-family:'nk57 reg';  background: #0e0700;  overflow:hidden; color: #fff;}
        .main_page{display: flex;  height: 100vh; width: 100vw;  color: hsl(0, 100%, 99%); max-width:100vw;  overflow-x: hidden; text-align: center; align-items: center; justify-content: center;}
        .columns{  grid-template-columns: 30vw 60vw; display: grid; }
        .left{  Grid-template-rows: 50vh 50vh minmax(0px,0fr); display: grid; }
        .right{  Grid-template-rows: 70vh 30vh minmax(0px,0fr); display: grid; overflow: hidden;  grid-template-columns: 1fr;  }

        .textbox{ text-align: left; position: relative; justify-content: center; margin: 12vh 9vw; grid-row: 2; width: 33vw; position: relative;  font-size: 21px; max-height: 15vw;  }

        /* Card tilts toward the cursor (--rx / --ry are set by the script at the bottom) */
        .card{ top:22vh; grid-row: 1; margin: 0 10vw; max-width: 21vw; max-height: 42vh; position: relative; transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 0.15s ease-out, box-shadow 0.3s ease; transform-style: preserve-3d; border-radius: 4.2px; box-shadow: 1px 2px 10px rgba(0, 0, 0, 0.5); }
        .card:hover{ transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(1.05); box-shadow: 5px 8px 30px rgba(0, 0, 0, 0.3); }
       
        .buttons{ margin-left:15vw; grid-row: 2;  align-self: center; height: 50vh;}
        .buttons button{ z-index: 1000; user-select: none; text-align: end; font-family: 'nk57 butter'; font-size: 42px;  width: 32vw; background-color: hsla(0, 100%, 99%, 0); color: hsl(0, 0%, 100%); border: none; cursor: pointer; border-radius: 4px; transition: transform 0.42s ease; }
        .buttons button:hover{ transform: scale(1.1) translate3d(-26px, -1px, 10px); background-color: hsla(0, 0%, 100%, 0); color: hsl(0, 0%, 1%); text-shadow: 
    -1.0px -1.0px 0 #fff,  
     1.0px -1.0px 0 #fff,
    -1.0px  1.0px 0 #fff,
     1.0px  1.0px 0 #fff;  transition:transform 0.15s ease-in-out; }
        
        .title{ top:-10vh; left: 2vw;  font-family: 'nk57 butter'; display: grid; grid-row: 1; margin: 0 5vw; font-size: 3.5rem; text-align: center; align-self: center; position: relative; color: hsl(0, 100%, 99%); text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); }
        
        .sub-title{ letter-spacing: 4.2px; top:2vh; left: 11vw;  font-family: 'nk57 butter'; margin: 0 5vw; font-size: 1.0rem; text-align: center; align-self: center; position: relative; color: hsl(0, 100%, 99%); text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); }

        .overlay_button{ position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; border: none; cursor: pointer; z-index: 0; }


        dialog[popover] {
            padding: 0;
            width: 66vw;            /* just wide enough for the text column */
            height: 100vh;
            border: none;
            background: transparent;
            overflow: hidden;
            align-self: center;
            justify-content: center;
        }

        dialog[popover]::backdrop {
            background: none; 
            backdrop-filter: blur(11px);
        }

        dialog iframe {
            display: flex;
            width: 100%;
            height: 100%;
            border: none;
            align-items: center;
            justify-content: center;
        }

        .slidebar{ position: relative; bottom: 0vh; left: 0vw; width: 100%; height: 100%; background-color: rgb(249, 248, 248); backdrop-filter: blur(5px); z-index: 9999; display: none; }

   </style>
   
</head>


   
<body>
    <!-- <div style="place-items: center; position:absolute; width: 100%; user-select: none;  display: grid; height: 100%; z-index: -1; " >
        <div>☮</div>
       <label for="volume">Volume: <span id="vol-value" style="width: 50vw; " >50</span></label>
       <input style="width: 50vw; accent-color: #fff;"  type="range" id="volume" name="volume" min="0" max="100" value="50" step="1">
    </div> -->

    <div class="main_page">
         
        <div class="columns"> 

            <div class="left">
                <img src="simon.jpg" alt="Simon Says Sell Logo" class="card">
                
                <div class="textbox">
                    Simon Says Sell is
                    my answer to the question: <br></br>
                    "How can I provide value to my local bussinesses with the skills and resources I already have"
                </div>

                

            </div>



            <div class="right">
                
                <div  class="title">
                simon says sell
                <p  class="sub-title">advertising studio</p>
                </div>
                
                <div class="buttons">
                    <button popovertarget="xyz dialog">XYZ</button>
                    <button popovertarget="debut dialog">DEBUT</button>
                    <button popovertarget="roadmap dialog">ROADMAP </button>
                    <button popovertarget="services dialog">SERVICES </button>
                </div>
            </div>

            <dialog id="xyz dialog" popover  style="background: #0000007c;">
                <iframe src="xyz.html" width="100%" height="100%" frameborder="0" ></iframe>
            </dialog>

            <dialog id="debut dialog" popover style="background: #0000007c;">
                <iframe src="debut.html" width="100%" height="100%" frameborder="0" ></iframe>
            </dialog>

            <dialog id="roadmap dialog" popover style="background: #0000007c;">
                <iframe src="roadmap.html" width="100%" height="100%" frameborder="0" ></iframe>
            </dialog>

            <dialog id="services dialog" popover  style="background: #0000007c;" >
                <iframe src="services.html" width="100%" height="100%" frameborder="0" ></iframe>
            </dialog>
        </div>
    </div>

    <script>
        const card = document.querySelector('.card');
        const MAX_TILT = 42; // degrees at the edge of the screen

        const clamp = (v) => Math.max(-1, Math.min(1, v));

        const section = document.querySelector('body');
        const mouse_down = false;
        const can_tilt = true;

        document.addEventListener('click', (e) => {
            
            if  (document.addEventListener('pointermove', (e))) {

                return;
            
            }

            const hovered = document.querySelector('.buttons');
            const bt = e.target.closest('.buttons button');

            document.addEventListener('mouseover', (event) => {
                bt = event.target.closest('.buttons button');

                
            });

            if (bt) {
                card.style.setProperty('--rx', '0deg');
                card.style.setProperty('--ry', '0deg');
            }
        });

        document.addEventListener('pointermove', (e) => {
            const r = card.getBoundingClientRect();
            const dx = (e.clientX - (r.left + r.width / 2)) / (window.innerWidth / 2);
            const dy = (e.clientY - (r.top + r.height / 2)) / (window.innerHeight / 2);

            const openPopovers = document.querySelectorAll(':popover-open');

            if (openPopovers.length == 0 && can_tilt) {
                card.style.setProperty('--ry', clamp(dx) * MAX_TILT + 'deg');
                card.style.setProperty('--rx', -clamp(dy) * MAX_TILT + 'deg');
            }
            else {
                card.style.setProperty('--rx', '0deg');
                card.style.setProperty('--ry', '0deg');
            }
        });

        // ease back to flat when the cursor leaves the window
        section.addEventListener('mouseleave', (e) => {
            card.style.setProperty('--rx', '0deg');
            card.style.setProperty('--ry', '0deg');
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @font-face {
            font-family: 'nk57';
            src: url('Fonts\\nk57_monospace\\NK57 Monospace Ex Lt.otf') format('opentype');

            font-family: 'nk57 butter';
            src: url('Fonts\\nk57_monospace\\NK57 Monospace Ex Lt.otf') format('opentype');
        }

        html{font-family: 'nk57';  background: #0e0700; display: flex;   height: 100vh; width: 100vw; max-height: 100vh;  color: hsl(0, 100%, 99%); max-width:100vw; overflow-x: hidden; text-align: center; align-items: center; justify-content: center; }
        body{grid-template-columns: 50vw 50vw; display: grid; }
        .left{  Grid-template-rows: 50vh 50vh minmax(0px,0fr); display: grid; }
        .right{  Grid-template-rows: 70vh 30vh minmax(0px,0fr); display: grid; overflow: hidden;  }

        .textbox{ position: relative; justify-content: center; margin: 5vh 18vw; grid-row: 2; width: 25vw; position: relative;  text-align: center; font-size: 25px; max-height: 15vw;  }
        .card{ top:25vh; grid-row: 1; margin: 0 20vw; max-width: 21vw; max-height: 42vh; position: relative; transition: transform 0.42s ease; transform-style: preserve-3d; border-radius: 4.2px; box-shadow: 1px 2px 10px rgba(0, 0, 0, 0.5); }
        .card:hover{ transform: scale(1.05) rotateX(5deg) rotateY(5deg); transition: transform 0.42s ease-in-out; box-shadow: 5px 8px 30px rgba(0, 0, 0, 0.3); }
       
        .buttons{ grid-row: 2; margin: 0 auto; grid-column: 2; align-self: center; height: 50vh;}
        .buttons button{ font-family: 'nk57 butter'; font-size: 42px; width: 33vw; background-color: hsla(0, 100%, 99%, 0); color: hsl(0, 0%, 100%); border: none; cursor: pointer; border-radius: 4px; transition: transform 0.42s ease; }
        .buttons button:hover{ transform: scale(1.1); background-color: hsla(0, 0%, 100%, 0); color: hsl(0, 0%, 1%); text-shadow: 
    -1.15px -1.15px 0 #fff,  
     1.15px -1.15px 0 #fff,
    -1.15px  1.15px 0 #fff,
     1.15px  1.15px 0 #fff;  transition:transform 0.15s ease-in-out; }
        
        .title{ display: grid; grid-column: 2; grid-row: 1; margin: 0 5vw; font-size: 3.5rem; text-align: center; align-self: center; position: relative; color: hsl(0, 100%, 99%); text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); }
   
   </style>
</head>
<body>
    <div class="left">
        <img src="simon.jpg" alt="Simon Says Sell Logo" class="card">

        <div class="textbox">
            Simon Says Sell is my answer to the question: <br></br>
            "How can I provide value to my community, with the skills and resources I currently have"
        </div>
    </div>

    

    <div class="right">
        <div  class="title">
           Simon Says Sell
        </div>
        <div class="buttons">
            <button>button </button>
            <button>button </button>
            <button>button </button>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @font-face {
            font-family: 'nk57 reg';
            src: url('Fonts\\nk57_monospace\\NK57 Monospace Sc Lt.otf') format('opentype');
        }

        @font-face {
            font-family: 'nk57 butter';
            src: url('Fonts\\nk57_monospace\\NK57 Monospace Ex Lt.otf') format('opentype');
        }

        html{ 
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none;     /* IE 10 and IE 11 */
            user-select: none;         /* Standard syntax */
            cursor: pointer;           /* Ensures the hand cursor shows instead of a text I-beam */
            font-family:'nk57 reg';  background: #0e0700; display: flex;  height: 100vh; width: 100vw;  color: hsl(0, 100%, 99%); max-width:100vw;  overflow-x: hidden; text-align: center; align-items: center; justify-content: center; }
        body{  grid-template-columns: 30vw 60vw; display: grid; }
        .left{  Grid-template-rows: 50vh 50vh minmax(0px,0fr); display: grid; }
        .right{  Grid-template-rows: 70vh 30vh minmax(0px,0fr); display: grid; overflow: hidden;  grid-template-columns: 1fr;  }

        .textbox{ text-align: left; position: relative; justify-content: center; margin: 12vh 9vw; grid-row: 2; width: 33vw; position: relative;  font-size: 21px; max-height: 15vw;  }
        .card{ top:22vh; grid-row: 1; margin: 0 10vw; max-width: 21vw; max-height: 42vh; position: relative; transition: transform 0.42s ease; transform-style: preserve-3d; border-radius: 4.2px; box-shadow: 1px 2px 10px rgba(0, 0, 0, 0.5); }
        .card:hover{ transform: scale(1.05) rotateX(5deg) rotateY(5deg); transition: transform 0.42s ease-in-out; box-shadow: 5px 8px 30px rgba(0, 0, 0, 0.3); }
       
        .buttons{ margin-left:15vw; grid-row: 2;  align-self: center; height: 50vh;}
        .buttons button{ z-index: 1000; user-select: none; text-align: end; font-family: 'nk57 butter'; font-size: 42px;  width: 32vw; background-color: hsla(0, 100%, 99%, 0); color: hsl(0, 0%, 100%); border: none; cursor: pointer; border-radius: 4px; transition: transform 0.42s ease; }
        .buttons button:hover{ transform: scale(1.1) translate3d(-26px, -1px, 10px); background-color: hsla(0, 0%, 100%, 0); color: hsl(0, 0%, 1%); text-shadow: 
    -1.15px -1.15px 0 #fff,  
     1.15px -1.15px 0 #fff,
    -1.15px  1.15px 0 #fff,
     1.15px  1.15px 0 #fff;  transition:transform 0.15s ease-in-out; }
        
        .title{ top:-10vh; left: 2vw;  font-family: 'nk57 butter'; display: grid; grid-row: 1; margin: 0 5vw; font-size: 3.5rem; text-align: center; align-self: center; position: relative; color: hsl(0, 100%, 99%); text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); }
            
        .overlay_button{ position: absolute; top: 1; left: 0; width: 100%; height: 100%; background: transparent; border: none; cursor: pointer; z-index: 0; }


        dialog[popover] {

    padding: 0;
    width: 66vw;            /* just wide enough for the text column */
    height: 100vh;
    border: none;
    background: transparent;
    overflow: hidden;
    align-self: center;
    justify-content: center;
}

dialog[popover]::backdrop {

    background: none; 
    backdrop-filter: blur(11px);
}

dialog iframe {
    display: flex;
    width: 100%;
    height: 100%;
    border: none;
    align-items: center;
    justify-content: center;
    
}
   </style>
</head>
<body>
    <div class="left">
        <img src="simon.jpg" alt="Simon Says Sell Logo" class="card">

        <div class="textbox">
            Simon Says Sell is
            my answer to the question: <br></br>
            "How can I provide value to my community, with the skills and resources I already have"
        </div>
    </div>

    

    <div class="right">
        <div  class="title">
           simon says sell
        </div>
        <div class="buttons">
            <button popovertarget="test dialog">LAUNCH</button>
            <button popovertarget="two dialog">bbbbbbbbbbbbb </button>
            <button popovertarget="three dialog">button </button>
        </div>
    </div>

    

</body>
</html>
<dialog id="test dialog" popover >
        <button popovertarget="test dialog" popvertargetaction="toggle" class="overlay_button"></button>
        <iframe src="test.html" width="100%" height="100%" frameborder="0" ></iframe>
       
    </dialog>

    <dialog id="two dialog" popover style="background: #0000007c;">
        <iframe src="two.html" width="100%" height="100%" frameborder="0" ></iframe>
       
    </dialog>

    <dialog id="three dialog" popover >
        <button popovertarget="three dialog" popvertargetaction="toggle" class="overlay_button"></button>
        <iframe src="three.html" width="100%" height="100%" frameborder="0" ></iframe>
       
    </dialog>
